services:
  - type: web
    name: nba-model-api
    env: python
    plan: free
    rootDir: .
    buildCommand: PYTHONPATH=. python3 scripts/export_backend_runtime_bundle.py --out-dir .deploy/backend-runtime && pip install -r ml-service/requirements.txt
    startCommand: cd ml-service && PYTHONPATH=/opt/render/project/src python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.example
