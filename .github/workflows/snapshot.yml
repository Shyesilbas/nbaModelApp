name: paper trading snapshot

# Freezes each game's prediction shortly before tip-off with the newest official injury report.
# GitHub cron cannot be scheduled per game and skips or delays runs (the first night only one of
# about twelve fired), so it is set every 10 minutes during US game hours (UTC, covers daylight
# and standard time) with a 45 minute window: any run that does fire in the 45 minutes before
# tip-off freezes the game. Runs with no game due exit before any
# network call. Data inputs come from scripts/ops/publish_snapshot_data.py (run each morning).
on:
  schedule:
    - cron: "5,15,25,35,45,55 22-23,0-3 * * 1-5"
    - cron: "5,15,25,35,45,55 15-23,0-3 * * 0,6"
  workflow_dispatch:
    inputs:
      pre_tip:
        description: "Minutes before tip-off a game counts as due"
        default: "45"
      dry_run:
        description: "Predict and print only, write nothing"
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt
      - run: pip install -r requirements-snapshot.txt
      - name: Snapshot games about to start
        run: PYTHONPATH=. python3 scripts/paper_trading_snapshot.py --pre-tip "${{ inputs.pre_tip || '45' }}" --final-attempt 25 ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the ledger
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -f data/predictions/paper_ledger_*.jsonl || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ledger: pre-tip snapshot $(date -u +%FT%TZ)"
          git pull --rebase
          git push
