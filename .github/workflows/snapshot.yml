name: paper trading snapshot

# Freezes each game's prediction shortly before tip-off with the newest official injury report.
# GitHub cron cannot be scheduled per game and skips or delays runs (the first night only one of
# about twelve fired), so it is set every 10 minutes during US game hours (UTC, covers daylight
# and standard time) with a 15 minute window: the official injury report is republished at :00, :15, :30
# and :45, so a run in the last 15 minutes before tip-off always sees the report from the last
# quarter hour. Any run that does fire in that window freezes the game. Runs with no game due exit before any
# network call. Data inputs come from scripts/ops/publish_snapshot_data.py (run each morning).
on:
  schedule:
    - cron: "5,15,25,35,45,55 22-23,0-3 * * 1-5"
    - cron: "5,15,25,35,45,55 15-23,0-3 * * 0,6"
  workflow_dispatch:
    inputs:
      pre_tip:
        description: "Minutes before tip-off a game counts as due"
        default: "15"
      dry_run:
        description: "Predict and print only, write nothing"
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # GitHub drops nearly all scheduled runs of morning-sync.yml, while this workflow is dispatched
  # every 10 minutes by an external cron. The first dispatch of the UTC day therefore starts the
  # morning sync if it has not succeeded yet (at most 3 failed attempts per day). The sync is a no-op
  # when nothing is missing, and workflow_dispatch from GITHUB_TOKEN is allowed to start a new run.
  ensure-morning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch morning sync if it has not run today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          runs=$(gh run list --workflow morning-sync.yml --created ">=$today" --limit 50 --json status,conclusion)
          ok=$(echo "$runs" | jq '[.[] | select(.status != "completed" or .conclusion == "success")] | length')
          failed=$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')
          if [ "$ok" -gt 0 ]; then echo "Morning sync already ran or is running today."; exit 0; fi
          if [ "$failed" -ge 3 ]; then echo "Morning sync failed $failed times today, not retrying."; exit 0; fi
          gh workflow run morning-sync.yml --ref main
          echo "Dispatched morning sync."

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt
      - run: pip install -r requirements-snapshot.txt
      - name: Snapshot games about to start
        run: PYTHONPATH=. python3 scripts/paper_trading_snapshot.py --pre-tip "${{ inputs.pre_tip || '15' }}" --final-attempt 6 ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the ledger
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -f data/predictions/paper_ledger_*.jsonl || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ledger: pre-tip snapshot $(date -u +%FT%TZ)"
          git pull --rebase
          git push
