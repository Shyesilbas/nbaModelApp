name: paper trading snapshot

# Freezes each game's prediction 15 minutes before tip-off with the newest official injury
# report. GitHub cron cannot be scheduled per game, so it fires at :15 and :45 during US game
# hours (UTC, covers both daylight and standard time); NBA tip-offs fall on the hour or half
# hour, so each lands in a run's 30 minute window. Runs with no game due exit before any
# network call. Data inputs come from scripts/ops/publish_snapshot_data.py (run each morning).
on:
  schedule:
    - cron: "15,45 22-23,0-3 * * 1-5"
    - cron: "15,45 15-23,0-3 * * 0,6"
  workflow_dispatch:
    inputs:
      pre_tip:
        description: "Minutes before tip-off a game counts as due"
        default: "30"
      dry_run:
        description: "Predict and print only, write nothing"
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt
      - run: pip install -r requirements-snapshot.txt
      - name: Snapshot games about to start
        run: PYTHONPATH=. python3 scripts/paper_trading_snapshot.py --pre-tip "${{ inputs.pre_tip || '30' }}" --final-attempt 20 ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the ledger
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -f data/predictions/paper_ledger_*.jsonl || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ledger: pre-tip snapshot $(date -u +%FT%TZ)"
          git pull --rebase
          git push
