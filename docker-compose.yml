version: '3.8'
services:
  ml-service:
    build: ./ml-service
    image: nba-ml-service:latest
    ports:
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - ./models:/app/models:ro
      - ./scripts:/app/scripts:ro

  # Optional services (uncomment and fill as needed):
