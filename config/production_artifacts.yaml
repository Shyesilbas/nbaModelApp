# Release of the models below (set by scripts/retrain_pipeline.py on promotion).
# File names carry no version; the release lives here and in each metadata file.
release: v15

win_model:
  model_path: models/production/win_model.pkl
  feature_columns_path: models/production/win_features.json
  metadata_path: models/production/win_metadata.json
  status: production
  notes: "Uncalibrated logistic regression on 11 features (ELO_DIFF, IS_HOME, CLEAN_NET_RTG_DIFF_LAST_10, WINRATE_DIFF_LAST_10, REST_DIFF, IS_B2B, OPP_IS_B2B, ABS_DIFF, MISSING_ROT_MINS_DIFF, ROT_CONTINUITY_DIFF, ACTIVE_WT_GS_DIFF)."

score_model:
  home_model_path: models/production/score_model_home_rtg.pkl
  away_model_path: models/production/score_model_away_rtg.pkl
  total_model_path: models/production/score_model_pace.pkl
  margin_model_path: models/production/score_model_margin.pkl
  ridge_total_path: models/production/score_model_ridge_total.pkl
  ridge_margin_path: models/production/score_model_ridge_margin.pkl
  metadata_path: models/production/score_metadata.json
  status: production
  notes: "Ridge pace model (2 features), offensive-rating models (4 features each), Ridge margin model (11 features), Ridge residual correction; targets are actual points."

player_model:
  pts_model_path: models/production/player_model_pts.pkl
  reb_model_path: models/production/player_model_reb.pkl
  ast_model_path: models/production/player_model_ast.pkl
  feature_columns_path: models/production/player_features.pkl
  metadata_path: models/production/player_metadata.json
  status: production
  notes: "LightGBM per target (L1 objective for PTS) on 24 features including position flags and the opponent allowance to the player position; no residual correction."
