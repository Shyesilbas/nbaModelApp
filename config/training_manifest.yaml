# Release stamped into every model's metadata by this training run. Bump it before
# retraining; promotion copies it to config/production_artifacts.yaml.
release: v15

train_seasons:
  - "2020-21"
  - "2021-22"
  - "2022-23"
  - "2023-24"
calibration_season: "2024-25"
validation_season: "2025-26"

holdout:
  strategy: season_holdout
  test_size: 0.2
  date_col: GAME_DATE
  # Metrics come from the model fitted before the holdout; the shipped model is
  # refit on every eligible row so it has seen the most recent completed season.
  final_refit_scope: all_eligible_rows

models:
  win:
    enabled: true
    feature_contract: config/features/win.yaml
  score:
    enabled: true
    feature_contract: config/features/score.yaml
  player:
    enabled: true
    feature_contract: config/features/player.yaml
    required_seasons:
      - "2020-21"
      - "2021-22"
      - "2022-23"
      - "2023-24"
      - "2024-25"
      - "2025-26"

promotion_thresholds:
  win:
    max_brier: 0.216
    min_roc_auc: 0.70
  score:
    max_total_mae: 16.0
    max_margin_mae: 13.0
  player:
    pts:
      max_mae: 5.6
      min_r2: 0.45
    reb:
      max_mae: 2.7
      min_r2: 0.35
    ast:
      max_mae: 2.4
      min_r2: 0.35

required_segments:
  - overall
  - regular_season
  - playoffs
  - home
  - away
  - close_games
  - favorites
  - underdogs
