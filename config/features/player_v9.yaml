schema_version: player_v9
targets:
  TARGET_PTS: pts
  TARGET_REB: reb
  TARGET_AST: ast
exclude_columns:
  - SEASON_ID
  - Player_ID
  - PLAYER_ID
  - player_id
  - GAME_DATE
  - MATCHUP
  - VIDEO_AVAILABLE
  # Same-game box score/outcome fields are targets or postgame information.
  - PTS
  - MIN
  - REB
  - AST
  - PLUS_MINUS
  - WL
  - WIN
  - TARGET_PTS
  - TARGET_REB
  - TARGET_AST
  - PLAYER_NAME
  - player_name
  - SEASON_TYPE
  - OPPONENT_ABBREVIATION
  - GAME_ID
  - Game_ID
  - game_id
  - TEAM_ABBREVIATION
  - PLAYER_POSITION_GROUP
  - PLAYOFF_ROUND
  - SERIES_GAME_NUMBER
  # Raw stats of the row's own game, kept only so inference can roll form forward.
  - GAME_PTS
  - GAME_REB
  - GAME_AST
  - GAME_MIN
  - GAME_USG_PCT
  - GAME_PLUS_MINUS
  # Zero-importance, dead regular season, and cross-positional noise columns:
  - CAN_CLINCH_SERIES
  - IS_ELIMINATION_GAME
  - IS_B2B
  - OPP_GUARD_REB_ALLOWED_LAST_10
  - OPP_WING_REB_ALLOWED_LAST_10
  - OPP_BIG_AST_ALLOWED_LAST_10
  - OPP_WING_PTS_ALLOWED_LAST_10
  - TEAM_ELO
  - OPP_ELO
  # No holdout permutation contribution for PTS, REB or AST (2026-10 audit),
  # most of them near-duplicates of a kept MIN/USG average.
  - ELO_DIFF
  - BLOWOUT_RISK_PROXY
  - TEAM_PACE
  - OPP_TEAM_PACE
  - OPP_BIG_PTS_ALLOWED_LAST_10
  - OPP_BIG_REB_ALLOWED_LAST_10
  - OPP_GUARD_PTS_ALLOWED_LAST_10
  - OPP_WING_AST_ALLOWED_LAST_10
  - OPP_GUARD_AST_ALLOWED_LAST_10
  - USG_PCT_LAST_3
  - USG_PCT_EMA_5
  - USG_PCT_STD_LAST_10
  - USG_PCT_TREND
  - MIN_LAST_10
  - MIN_STD_LAST_10
  - PLUS_MINUS_LAST_5
required_context_columns:
  - SEASON_ID
  - GAME_DATE
  - IS_PLAYOFF
  - IS_HOME
  - PLAYER_POSITION_GROUP
  - USG_PCT_LAST_10
  - MIN_EMA_10
lgb_params_by_target:
  # Fit the conditional median for points: they are right-skewed and the model
  # is judged on MAE, which the median minimises. In walk-forward tests over
  # 2023-24..2025-26 the L1 objective cut PTS MAE (4.564 -> 4.557) but raised
  # REB (1.901 -> 1.903) and AST (1.339 -> 1.348) MAE, so it applies to PTS only.
  pts:
    objective: l1
