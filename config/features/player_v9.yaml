schema_version: player_v9
targets:
  TARGET_PTS: pts
  TARGET_REB: reb
  TARGET_AST: ast
exclude_columns:
  - SEASON_ID
  - Player_ID
  - PLAYER_ID
  - player_id
  - GAME_DATE
  - MATCHUP
  - VIDEO_AVAILABLE
  # Same-game box score/outcome fields are targets or postgame information.
  - PTS
  - MIN
  - REB
  - AST
  - PLUS_MINUS
  - WL
  - WIN
  - TARGET_PTS
  - TARGET_REB
  - TARGET_AST
  - PLAYER_NAME
  - player_name
  - SEASON_TYPE
  - OPPONENT_ABBREVIATION
  - GAME_ID
  - Game_ID
  - game_id
  - TEAM_ABBREVIATION
  - PLAYER_POSITION_GROUP
  - PLAYOFF_ROUND
  - SERIES_GAME_NUMBER
  # Zero-importance, dead regular season, and cross-positional noise columns:
  - CAN_CLINCH_SERIES
  - IS_ELIMINATION_GAME
  - IS_B2B
  - OPP_GUARD_REB_ALLOWED_LAST_10
  - OPP_WING_REB_ALLOWED_LAST_10
  - OPP_BIG_AST_ALLOWED_LAST_10
  - OPP_WING_PTS_ALLOWED_LAST_10
  - TEAM_ELO
  - OPP_ELO
required_context_columns:
  - SEASON_ID
  - GAME_DATE
  - IS_PLAYOFF
  - IS_HOME
  - PLAYER_POSITION_GROUP
  - USG_PCT_LAST_10
  - MIN_EMA_10
