schema_version: score_v10
# Standardized RidgeCV beat the tuned XGBRegressor on every target in
# walk-forward tests (pace 3.62 vs 3.75, rating 9.31 vs 9.45 MAE).
estimator: ridge
targets:
  pace: TARGET_PACE
  home_off_rtg: TARGET_HOME_OFF_RTG
  away_off_rtg: TARGET_AWAY_OFF_RTG
  margin: TARGET_MARGIN
pace_features:
  - PACE_LAST_5
  - PACE_LAST_10
  - OPP_PACE_LAST_5
  - OPP_PACE_LAST_10
  - OFF_RTG_LAST_5
  - DEF_RTG_LAST_5
  - OPP_OFF_RTG_LAST_5
  - OPP_DEF_RTG_LAST_5
  - DAYS_REST
  - OPP_DAYS_REST
  - IS_3_IN_4
  - OPP_IS_3_IN_4
  - PACE_COLLISION
  - FG3A_RATE_LAST_5
  - OPP_FG3A_RATE_LAST_5
base_off_rtg_features:
  - OFF_RTG_LAST_5
  - OFF_RTG_LAST_10
  - PACE_LAST_5
  - WINRATE_LAST_5
  - OPP_DEF_RTG_LAST_5
  - OPP_DEF_RTG_LAST_10
  - OPP_PACE_LAST_5
  - DAYS_REST
  - OPP_DAYS_REST
  - EFG_PCT_LAST_5
  - EFG_PCT_LAST_10
  - DEF_EFG_PCT_LAST_5
  - FT_RATE_LAST_5
  - TOV_PCT_LAST_5
  - FG3A_RATE_LAST_5
  - FG3A_RATE_LAST_10
  - ORB_PCT_LAST_5
  - DEF_TOV_PCT_LAST_5
  - DEF_ORB_PCT_LAST_5
  - AST_TO_TOV_LAST_5
  - PTS_SHARE_3PT_LAST_5
  - PTS_SHARE_PAINT_LAST_5
away_extra_features:
  - TRAVEL_DISTANCE
  - TIMEZONE_DIFF
# Margin uses its own short list: ELO_DIFF and CLEAN_NET_RTG_DIFF_LAST_10 carry
# almost all of the signal; a 5-feature Ridge scored 11.86 margin MAE vs 12.27
# for the 40-feature XGB. margin_extra_features is ignored when this is set.
margin_features:
  - ELO_DIFF
  - CLEAN_NET_RTG_DIFF_LAST_10
  - NET_RTG_LAST_10
  - DAYS_REST
  - OPP_DAYS_REST
margin_extra_features:
  - DEF_RTG_LAST_5
  - DEF_RTG_LAST_10
  - OPP_OFF_RTG_LAST_5
  - NET_RTG_LAST_5
  - NET_RTG_LAST_10
  - OPP_NET_RTG_LAST_5
  - NET_RTG_DIFF_LAST_10
  - CLEAN_NET_RTG_DIFF_LAST_10
  - EFG_DIFF_LAST_10
  - THREE_POINT_RATE_DIFF
  - FT_MARGIN_LAST_5
  - ELO_DIFF

