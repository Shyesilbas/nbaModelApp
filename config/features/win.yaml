schema_version: win
target: WIN
base_feature_file: config/features/win_base_columns.json
derived_features:
  - PRE_GAME_ELO
  - OPP_PRE_GAME_ELO
  - ELO_DIFF
  - ABS_ELO_DIFF
  - WINRATE_DIFF_LAST_10
  - ABS_WINRATE_DIFF_LAST_10
  - REST_DIFF
  - IS_CLOSE_STRENGTH
  - PLAYOFF_ELO_DIFF
  - PLAYOFF_ABS_ELO_DIFF
  - PLAYOFF_REST_DIFF
  - CLOSE_STRENGTH_REST_DIFF
  - NET_RTG_DIFF_LAST_10
  - CLEAN_NET_RTG_DIFF_LAST_10
  - CLUTCH_NET_RTG_DIFF_LAST_10
  - EFG_DIFF_LAST_10
  - THREE_POINT_RATE_DIFF
  - TOV_FORCED_DIFF
  - REBOUND_CONTROL_DIFF
  - PACE_COLLISION
  - AST_TO_TOV_DIFF_LAST_5
  - HAVOC_RATE_DIFF_LAST_5
  - FT_MARGIN_DIFF_LAST_5
  - FG3_REGRESSION_DIFF
  - SCORE_PRED_MARGIN
static_venue_split_features:
  - HOME_WINRATE_LAST_5
  - HOME_PTS_LAST_5
  - HOME_PTS_ALLOWED_LAST_5
  - AWAY_WINRATE_LAST_5
  - AWAY_PTS_LAST_5
  - AWAY_PTS_ALLOWED_LAST_5
  - OPP_HOME_WINRATE_LAST_5
  - OPP_HOME_PTS_LAST_5
  - OPP_HOME_PTS_ALLOWED_LAST_5
  - OPP_AWAY_WINRATE_LAST_5
  - OPP_AWAY_PTS_LAST_5
  - OPP_AWAY_PTS_ALLOWED_LAST_5
# 2026-10-20: ABS_DIFF = roster availability tonight vs what last-15-game form already
# credits (src/features/roster_absence.py). It is the only feature that improved WIN Brier
# in all 5 walk-forward seasons (mean -0.0032 with true availability, -0.0006 when every
# player is assumed to play whoever played last game), and it is the input that lets a
# player marked OUT in the frontend move the team probability.
required_features:
  - ABS_DIFF
excluded_features:
  # 2026-10-20 forward selection on walk-forward folds 2021-24 (2025-26 held out)
  # kept 7 features: ELO_DIFF, IS_HOME, REST_DIFF, CLEAN_NET_RTG_DIFF_LAST_10,
  # WINRATE_DIFF_LAST_10, IS_B2B, OPP_IS_B2B. They beat the 32-feature set on both
  # (log loss 0.6217 vs 0.6225; 2025-26 0.5981 vs 0.6002). The rest were noise or
  # exact linear combinations (WINRATE_DIFF = WINRATE - OPP_WINRATE, REST_DIFF =
  # DAYS_REST - OPP_DAYS_REST) that flipped coefficient signs in SHAP output.
  # WINRATE_DIFF_LAST_10 keeps a negative coefficient on purpose: at equal Elo and
  # net rating a higher win rate means close-game luck, which regresses.
  - DAYS_REST
  - OPP_DAYS_REST
  - WINRATE_LAST_10
  - OPP_WINRATE_LAST_10
  - PTS_LAST_5
  - OPP_PTS_LAST_5
  - PTS_ALLOWED_LAST_5
  - OPP_PTS_ALLOWED_LAST_5
  - H2H_WINRATE_LAST_5
  - H2H_PTS_LAST_5
  - H2H_PTS_ALLOWED_LAST_5
  - CURRENT_VENUE_WINRATE_LAST_5
  - CURRENT_VENUE_PTS_LAST_5
  - CURRENT_VENUE_PTS_ALLOWED_LAST_5
  - OPP_CURRENT_VENUE_WINRATE_LAST_5
  - OPP_CURRENT_VENUE_PTS_LAST_5
  - OPP_CURRENT_VENUE_PTS_ALLOWED_LAST_5
  - EFG_DIFF_LAST_10
  - THREE_POINT_RATE_DIFF
  - TOV_FORCED_DIFF
  - REBOUND_CONTROL_DIFF
  # Built from a player model trained on overlapping historical outcomes;
  # until date-safe player OOF predictions are available these are not valid inputs.
  - TEAM_V3_PROJ_PTS_SUM
  - TEAM_V3_PROJ_PTS_AVG
  - TEAM_V3_PROJ_REB_SUM
  - TEAM_V3_PROJ_REB_AVG
  - TEAM_V3_PROJ_AST_SUM
  - TEAM_V3_PROJ_AST_AVG
  - TEAM_V3_PROJ_PRA_SUM
  - TEAM_V3_PROJ_PRA_AVG
  - OPP_V3_PROJ_PTS_SUM
  - OPP_V3_PROJ_PTS_AVG
  - OPP_V3_PROJ_REB_SUM
  - OPP_V3_PROJ_REB_AVG
  - OPP_V3_PROJ_AST_SUM
  - OPP_V3_PROJ_AST_AVG
  - OPP_V3_PROJ_PRA_SUM
  - OPP_V3_PROJ_PRA_AVG
  # Zero-importance, multicollinear, and dead regular season features pruned for clean compact modeling:
  - H2H_GAMES_LAST_5
  - OPP_H2H_GAMES_LAST_5
  - OPP_H2H_WINRATE_LAST_5
  - CAN_CLINCH_SERIES
  - IS_ELIMINATION_GAME
  - IS_CLOSE_STRENGTH
  - CLOSE_STRENGTH_REST_DIFF
  - PLAYOFF_REST_DIFF
  - PLAYOFF_ELO_DIFF
  - PLAYOFF_ABS_ELO_DIFF
  - ABS_ELO_DIFF
  - ABS_WINRATE_DIFF_LAST_10
  - PRE_GAME_ELO
  - OPP_PRE_GAME_ELO
  # Exact duplicates (OPP_H2H_* mirrors H2H_*), near-duplicates (|r| >= 0.98)
  # and features with no permutation contribution in walk-forward tests.
  - OPP_H2H_PTS_ALLOWED_LAST_5
  - OPP_H2H_PTS_LAST_5
  - NET_RTG_DIFF_LAST_10
  - CLUTCH_NET_RTG_DIFF_LAST_10
  - IS_PLAYOFF
  - PTS_LAST_10
  - PTS_ALLOWED_LAST_10
  - OPP_PTS_LAST_10
  - OPP_PTS_ALLOWED_LAST_10
  # Removing the SCORE model's margin makes WIN independent of SCORE: it added
  # nothing in walk-forward tests and forced WIN to drop rows without SCORE OOF.
  - SCORE_PRED_MARGIN
  - WINRATE_LAST_5
  - OPP_WINRATE_LAST_5
  - FG3_REGRESSION_DELTA
  - OPP_FG3_REGRESSION_DELTA
  - FG3_REGRESSION_DIFF
  - HAVOC_RATE_LAST_5
  - OPP_HAVOC_RATE_LAST_5
  - HAVOC_RATE_DIFF_LAST_5
  - FOUL_RATE_LAST_5
  - OPP_FOUL_RATE_LAST_5
  - FT_MARGIN_LAST_5
  - OPP_FT_MARGIN_LAST_5
  - FT_MARGIN_DIFF_LAST_5
  - AST_TO_TOV_LAST_5
  - OPP_AST_TO_TOV_LAST_5
  - AST_TO_TOV_DIFF_LAST_5
  - PACE_COLLISION
defaultable_features:
  ABS_DIFF: 0.0
  IS_ELIMINATION_GAME: 0
