  FT_MARGIN_DIFF_LAST_5: 0.0
  FG3_REGRESSION_DIFF: 0.0
  FG3_REGRESSION_DELTA: 0.0
  OPP_FG3_REGRESSION_DELTA: 0.0
  AST_TO_TOV_LAST_5: 1.8
  OPP_AST_TO_TOV_LAST_5: 1.8
  HAVOC_RATE_LAST_5: 0.12
