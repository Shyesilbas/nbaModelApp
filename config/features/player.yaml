schema_version: player
targets:
  TARGET_PTS: pts
  TARGET_REB: reb
  TARGET_AST: ast
# Explicit feature list: an exclusion list silently admitted every new dataset column.
# 2026-10-20 walk-forward (2023-24..2025-26, train on earlier seasons): one EMA per
# stat instead of LAST_5/LAST_10/EMA near-duplicates (|r| >= 0.98), plus position
# flags and the opponent's allowance to the player's position group. Against the
# previous 22-feature model with its Ridge residual correction, MAE moved
# PTS 4.554 -> 4.509, AST 1.337 -> 1.334, REB 1.898 -> 1.901; the Ridge
# correction was dropped because it raised PTS MAE in every season (L2 shift on an
# L1 / median model).
features:
  - IS_HOME
  - IS_PLAYOFF
  - DAYS_REST
  - IS_GUARD
  - IS_BIG
  - PTS_LAST_5
  - PTS_EMA_10
  - PTS_PER_MIN_LAST_10
  - REB_LAST_5
  - REB_EMA_10
  - REB_PER_MIN_LAST_10
  - AST_LAST_5
  - AST_EMA_10
  - AST_PER_MIN_LAST_10
  - MIN_LAST_3
  - MIN_EMA_10
  - MIN_TREND
  - USG_PCT_EMA_10
  - OPP_POS_PTS_ALLOWED_LAST_10
  - OPP_POS_REB_ALLOWED_LAST_10
  - OPP_POS_AST_ALLOWED_LAST_10
  # Team rotation absence & chemistry (cuts PTS MAE from 4.537 to 4.461, REB to 1.884, AST to 1.306)
  - MISSING_ROT_MINS
  - ROT_CONTINUITY
  - ACTIVE_WT_GS
required_context_columns:
  - SEASON_ID
  - GAME_DATE
  - IS_PLAYOFF
  - IS_HOME
  - PLAYER_POSITION_GROUP
  - MIN_EMA_10
  - OPP_GUARD_PTS_ALLOWED_LAST_10
  - OPP_WING_PTS_ALLOWED_LAST_10
  - OPP_BIG_PTS_ALLOWED_LAST_10
  - OPP_GUARD_REB_ALLOWED_LAST_10
  - OPP_WING_REB_ALLOWED_LAST_10
  - OPP_BIG_REB_ALLOWED_LAST_10
  - OPP_GUARD_AST_ALLOWED_LAST_10
  - OPP_WING_AST_ALLOWED_LAST_10
  - OPP_BIG_AST_ALLOWED_LAST_10
lgb_params_by_target:
  # 2026-10-25: In walk-forward tests over 2021-22..2025-26 with 24 rotation features,
  # the L1 median objective minimizes MAE across all three prop targets, reducing
  # 5-season walk-forward MAE for PTS to 4.460, REB to 1.864 (-0.020), and AST to 1.279 (-0.026).
  pts:
    objective: l1
    num_leaves: 20
    min_child_samples: 50
  reb:
    objective: l1
  ast:
    objective: l1
