schema_version: score
# Standardized RidgeCV beat the tuned XGBRegressor on every target in
# walk-forward tests (pace 3.62 vs 3.75, rating 9.31 vs 9.45 MAE).
estimator: ridge
targets:
  pace: TARGET_PACE
  home_off_rtg: TARGET_HOME_OFF_RTG
  away_off_rtg: TARGET_AWAY_OFF_RTG
  margin: TARGET_MARGIN
# 2026-10-20: two features per sub-model. On actual points over five walk-forward
# seasons they tied the 15/22/24-feature lists (total MAE 14.901 vs 14.907) while
# the long lists only added collinear pairs whose SHAP impacts cancelled
# (PACE_COLLISION -5.8 vs OPP_PACE_LAST_5 +5.0, PTS_SHARE_3PT vs FG3A_RATE).
pace_features:
  - PACE_LAST_10
  - OPP_PACE_LAST_10
base_off_rtg_features:
  - OFF_RTG_LAST_10
  - OPP_DEF_RTG_LAST_10
  # roster availability of both teams tonight vs form (src/features/roster_absence.py):
  # own-points MAE 9.466 -> 9.415, better in all 5 walk-forward seasons
  - ABS_DELTA
  - OPP_ABS_DELTA
away_extra_features: []
# Margin uses its own short list: ELO_DIFF and CLEAN_NET_RTG_DIFF_LAST_10 carry
# almost all of the signal; a 5-feature Ridge scored 11.86 margin MAE vs 12.27
# for the 40-feature XGB. margin_extra_features is ignored when this is set.
# 2026-10-20: the WIN model's inputs replaced the one-sided NET_RTG_LAST_10; on
# actual-point margins they won 4 of 5 walk-forward seasons and tied the fifth
# (mean MAE 10.99 vs 11.03), and keep the score margin in line with WIN.
margin_features:
  - ELO_DIFF
  - CLEAN_NET_RTG_DIFF_LAST_10
  - WINRATE_DIFF_LAST_10
  - DAYS_REST
  - OPP_DAYS_REST
  - IS_B2B
  - OPP_IS_B2B
  # roster availability tonight vs form (see win.yaml); -0.13 mean walk-forward margin MAE
  - ABS_DIFF
margin_extra_features:
  - DEF_RTG_LAST_5
  - DEF_RTG_LAST_10
  - OPP_OFF_RTG_LAST_5
  - NET_RTG_LAST_5
  - NET_RTG_LAST_10
  - OPP_NET_RTG_LAST_5
  - NET_RTG_DIFF_LAST_10
  - CLEAN_NET_RTG_DIFF_LAST_10
  - EFG_DIFF_LAST_10
  - THREE_POINT_RATE_DIFF
  - FT_MARGIN_LAST_5
  - ELO_DIFF

